# Advanced GitLab CI/CD Patterns for Kubernetes Deployment

## Configuration with Environment-Specific Deployments

```yaml
stages:
  - build
  - test
  - security
  - deploy

variables:
  REGISTRY: "docker.io"
  IMAGE_NAME: "${REGISTRY}/${DOCKER_USERNAME}/boardgame"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"

# Build Docker Image
build:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build -t ${IMAGE_NAME}:${IMAGE_TAG} -t ${IMAGE_NAME}:latest .
    - docker push ${IMAGE_NAME}:${IMAGE_TAG}
    - docker push ${IMAGE_NAME}:latest
  only:
    - main
    - develop
  tags:
    - kubernetes

# Unit Tests
unit_tests:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn clean test
  artifacts:
    reports:
      junit: target/surefire-reports/**.xml
  cache:
    paths:
      - .m2/repository
  tags:
    - kubernetes

# Integration Tests
integration_tests:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - mvn clean verify -DskipUnitTests=true
  artifacts:
    reports:
      junit: target/failsafe-reports/**.xml
  allow_failure: true
  cache:
    paths:
      - .m2/repository
  tags:
    - kubernetes

# Security Scanning
sast_scan:
  stage: security
  image: maven:3.9-eclipse-temurin-17
  script:
    - apt-get update && apt-get install -y npm
    - npm install -g snyk
    - mvn clean compile
    - snyk test --severity-threshold=high || true
  allow_failure: true
  tags:
    - kubernetes

# Deploy to Development
deploy_dev:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: development
    kubernetes:
      namespace: web-apps-dev
  before_script:
    - kubectl create namespace web-apps-dev --dry-run=client -o yaml | kubectl apply -f -
  script:
    - kubectl set image deployment/boardgame-deployment boardgame=${IMAGE_NAME}:${IMAGE_TAG} -n web-apps-dev || true
    - kubectl apply -f deployment-service.yaml -n web-apps-dev
    - kubectl rollout status deployment/boardgame-deployment -n web-apps-dev
  when: on_success
  only:
    - develop
  tags:
    - kubernetes

# Deploy to Production
deploy_prod:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: production
    kubernetes:
      namespace: web-apps-prod
  before_script:
    - kubectl create namespace web-apps-prod --dry-run=client -o yaml | kubectl apply -f -
  script:
    - kubectl set image deployment/boardgame-deployment boardgame=${IMAGE_NAME}:${IMAGE_TAG} -n web-apps-prod || true
    - kubectl apply -f deployment-service.yaml -n web-apps-prod
    - kubectl rollout status deployment/boardgame-deployment -n web-apps-prod
  when: manual  # Require manual approval for production
  only:
    - main
  tags:
    - kubernetes
```

## Configuration with Canary Deployment

```yaml
stages:
  - build
  - deploy_canary
  - verify_canary
  - deploy_production

# Canary Deployment (10% traffic)
deploy_canary:
  stage: deploy_canary
  image: bitnami/kubectl:latest
  environment:
    name: canary
    kubernetes:
      namespace: web-apps
  script:
    # Create canary deployment with replicas=1
    - kubectl set image deployment/boardgame-canary boardgame=${IMAGE_NAME}:${IMAGE_TAG} -n web-apps || true
    - kubectl apply -f - <<EOF
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boardgame-canary
  namespace: web-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: boardgame
      version: canary
  template:
    metadata:
      labels:
        app: boardgame
        version: canary
    spec:
      containers:
      - name: boardgame
        image: ${IMAGE_NAME}:${IMAGE_TAG}
        ports:
        - containerPort: 8080
EOF
    - kubectl rollout status deployment/boardgame-canary -n web-apps
  only:
    - main
  tags:
    - kubernetes

# Health Check on Canary
verify_canary:
  stage: verify_canary
  image: curlimages/curl:latest
  script:
    - export CANARY_IP=$(kubectl get svc boardgame-service -n web-apps -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
    - echo "Testing canary deployment at $CANARY_IP"
    - curl -f http://${CANARY_IP}:80/health || exit 1
    - echo "Canary health check passed"
  only:
    - main
  tags:
    - kubernetes

# Full Production Deployment
deploy_production:
  stage: deploy_production
  image: bitnami/kubectl:latest
  environment:
    name: production
    kubernetes:
      namespace: web-apps
  script:
    # Update main deployment
    - kubectl set image deployment/boardgame-deployment boardgame=${IMAGE_NAME}:${IMAGE_TAG} -n web-apps
    - kubectl rollout status deployment/boardgame-deployment -n web-apps
    # Delete canary deployment
    - kubectl delete deployment boardgame-canary -n web-apps --ignore-not-found=true
  when: manual
  only:
    - main
  tags:
    - kubernetes
```

## Configuration with Blue-Green Deployment

```yaml
stages:
  - build
  - deploy_green
  - verify_green
  - switch_blue_green

deploy_green:
  stage: deploy_green
  image: bitnami/kubectl:latest
  environment:
    name: green
    kubernetes:
      namespace: web-apps
  script:
    - kubectl apply -f - <<EOF
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boardgame-green
  namespace: web-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: boardgame
      slot: green
  template:
    metadata:
      labels:
        app: boardgame
        slot: green
    spec:
      containers:
      - name: boardgame
        image: ${IMAGE_NAME}:${IMAGE_TAG}
        ports:
        - containerPort: 8080
EOF
    - kubectl rollout status deployment/boardgame-green -n web-apps
  only:
    - main
  tags:
    - kubernetes

verify_green:
  stage: verify_green
  image: curlimages/curl:latest
  script:
    - export GREEN_POD=$(kubectl get pods -n web-apps -l slot=green -o jsonpath='{.items[0].metadata.name}')
    - kubectl port-forward -n web-apps pod/$GREEN_POD 8080:8080 &
    - sleep 5
    - curl -f http://localhost:8080/health || exit 1
  only:
    - main
  tags:
    - kubernetes

switch_blue_green:
  stage: switch_blue_green
  image: bitnami/kubectl:latest
  environment:
    name: production-bgd
    kubernetes:
      namespace: web-apps
  script:
    # Switch service to green
    - kubectl patch service boardgame-service -n web-apps -p '{"spec":{"selector":{"slot":"green"}}}'
    # Delete old blue deployment
    - kubectl delete deployment boardgame-blue -n web-apps --ignore-not-found=true
    # Rename green to blue for next deployment
    - kubectl patch deployment boardgame-green -n web-apps --type='json' -p='[{"op": "replace", "path": "/metadata/name", "value":"boardgame-blue"}]' || true
  when: manual
  only:
    - main
  tags:
    - kubernetes
```

## Configuration with Helm Integration

```yaml
stages:
  - package
  - test_helm
  - deploy_helm

variables:
  HELM_VERSION: "3.12.0"
  HELM_CHART_VERSION: "1.0.0"

package_helm_chart:
  stage: package
  image: alpine/helm:${HELM_VERSION}
  script:
    - helm package ./helm/boardgame-chart --version ${HELM_CHART_VERSION}
    - mkdir -p artifacts
    - mv boardgame-chart-${HELM_CHART_VERSION}.tgz artifacts/
  artifacts:
    paths:
      - artifacts/
  only:
    - main
  tags:
    - kubernetes

test_helm_deployment:
  stage: test_helm
  image: alpine/helm:${HELM_VERSION}
  script:
    - helm template boardgame ./helm/boardgame-chart
    - helm lint ./helm/boardgame-chart
  allow_failure: true
  tags:
    - kubernetes

deploy_with_helm:
  stage: deploy_helm
  image: alpine/helm:${HELM_VERSION}
  before_script:
    - helm repo add stable https://charts.helm.sh/stable
    - helm repo update
  script:
    - helm upgrade --install boardgame ./helm/boardgame-chart -n web-apps --create-namespace
    - helm get values boardgame -n web-apps
    - helm get deployed boardgame -n web-apps
  environment:
    name: production-helm
    kubernetes:
      namespace: web-apps
  when: manual
  only:
    - main
  tags:
    - kubernetes
```

## Configuration with Automated Rollback

```yaml
stages:
  - deploy
  - health_check
  - rollback

deploy_update:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: production
    kubernetes:
      namespace: web-apps
  script:
    - kubectl set image deployment/boardgame-deployment boardgame=${IMAGE_NAME}:${IMAGE_TAG} -n web-apps
    - kubectl rollout status deployment/boardgame-deployment -n web-apps --timeout=5m
  only:
    - main
  tags:
    - kubernetes

health_check:
  stage: health_check
  image: curlimages/curl:latest
  script:
    - export SERVICE_IP=$(kubectl get svc boardgame-service -n web-apps -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
    - echo "Checking health at $SERVICE_IP"
    - curl -f http://${SERVICE_IP}:80/health
    - echo "Health check passed"
  retry:
    max: 3
    when: script_failure
  only:
    - main
  tags:
    - kubernetes

rollback_on_failure:
  stage: rollback
  image: bitnami/kubectl:latest
  environment:
    name: production
    kubernetes:
      namespace: web-apps
  script:
    - echo "Rolling back to previous version..."
    - kubectl rollout undo deployment/boardgame-deployment -n web-apps
    - kubectl rollout status deployment/boardgame-deployment -n web-apps
  when: on_failure
  only:
    - main
  tags:
    - kubernetes
```

## Tips & Best Practices

1. **Always use specific image tags** - Avoid `latest` in production
2. **Implement health checks** - Both liveness and readiness probes
3. **Use resource limits** - Prevent resource exhaustion
4. **Implement RBAC** - Service accounts with minimal permissions
5. **Enable pod security policies** - Restrict privileged containers
6. **Use secrets for credentials** - Never hardcode sensitive data
7. **Implement network policies** - Restrict pod-to-pod communication
8. **Monitor and log** - Integrate with monitoring solutions
9. **Test deployments** - Canary and blue-green deployments
10. **Document everything** - Keep runbooks and procedures updated
