# GitLab CI/CD Configuration with Kubernetes Runner
# This configuration is optimized to run on GitLab Runner deployed in Kubernetes
# It uses container-based jobs that run as pods in your Kubernetes cluster

stages:
  - install_tools
  - test
  - security
  - build
  - docker
  - deploy

variables:
  DOCKER_HOST: "tcp://localhost:2375"
  DOCKER_TLS_CERTDIR: ""
  KUBECONFIG: "/kubeconfig/config"

# Job to install tools and verify environment
install_maven_trivy_docker_kubectl_tools:
  stage: install_tools
  image: maven:3.9-eclipse-temurin-17
  services:
    - docker:24-dind
    - name: docker:24-dind
      alias: docker
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl gnupg wget
    - wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | apt-key add -
    - echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | tee -a /etc/apt/sources.list.d/trivy.list
    - apt-get update && apt-get install -y trivy
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
  script:
    - echo "=== Maven Version ==="
    - mvn --version
    - echo "=== Trivy Version ==="
    - trivy --version
    - echo "=== Kubectl Version ==="
    - kubectl version --client
    - echo "=== Docker Version ==="
    - docker --version
  cache:
    paths:
      - .m2/repository
  tags:
    - kubernetes
    - docker

# Unit Testing with Maven
unit_testing:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  before_script:
    - apt-get update -qq
  script:
    - echo "Running unit tests..."
    - mvn clean test
  artifacts:
    reports:
      junit:
        - target/surefire-reports/*.xml
    paths:
      - target/
  cache:
    paths:
      - .m2/repository
  tags:
    - kubernetes

# Trivy File System Scan
trivy_fs_scan:
  stage: security
  image: aquasec/trivy:latest
  script:
    - echo "Running Trivy filesystem scan..."
    - trivy fs --format table --output fs-scan-report.txt .
    - trivy fs --format json --output fs-scan-report.json .
  artifacts:
    paths:
      - fs-scan-report.txt
      - fs-scan-report.json
    expire_in: 30 days
  tags:
    - kubernetes

# SonarQube Code Quality Analysis
sonarqube-check:
  stage: security
  image: maven:3.9-eclipse-temurin-17
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
      - .m2/repository
  script:
    - apt-get update -qq && apt-get install -y curl
    - curl --version
    - mvn clean verify sonar:sonar \
        -Dsonar.projectKey=$SONAR_PROJECT_KEY \
        -Dsonar.sources=. \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.login=$SONAR_TOKEN
  allow_failure: true
  only:
    - main
  tags:
    - kubernetes

# Build Application with Maven
build_app:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  before_script:
    - apt-get update -qq
  script:
    - echo "Building application..."
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
      - target/*.war
    expire_in: 1 day
  cache:
    paths:
      - .m2/repository
  only:
    - main
  tags:
    - kubernetes

# Build and Push Docker Image
build_and_tag_push_image:
  stage: docker
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
  script:
    - echo "Building Docker image..."
    - docker build -t $DOCKER_USERNAME/boardgame:${CI_COMMIT_SHA:0:8} .
    - docker tag $DOCKER_USERNAME/boardgame:${CI_COMMIT_SHA:0:8} $DOCKER_USERNAME/boardgame:latest
    - echo "Pushing Docker image..."
    - docker push $DOCKER_USERNAME/boardgame:${CI_COMMIT_SHA:0:8}
    - docker push $DOCKER_USERNAME/boardgame:latest
  only:
    - main
  tags:
    - kubernetes
    - docker

# Scan Docker Image with Trivy
docker_image_scan:
  stage: security
  image: aquasec/trivy:latest
  script:
    - echo "Scanning Docker image with Trivy..."
    - trivy image --format table --output image-scan-report.txt $DOCKER_USERNAME/boardgame:latest
    - trivy image --format json --output image-scan-report.json $DOCKER_USERNAME/boardgame:latest
    - trivy image --severity CRITICAL,HIGH --exit-code 0 $DOCKER_USERNAME/boardgame:latest
  artifacts:
    paths:
      - image-scan-report.txt
      - image-scan-report.json
    expire_in: 30 days
  allow_failure: true
  only:
    - main
  tags:
    - kubernetes

# Deploy to Kubernetes
k8s_deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  before_script:
    # Create namespace if it doesn't exist
    - kubectl create namespace web-apps --dry-run=client -o yaml | kubectl apply -f -
    - echo "Namespace ready"
  script:
    - echo "Deploying to Kubernetes..."
    - echo "Cluster info:"
    - kubectl cluster-info
    - echo "Nodes:"
    - kubectl get nodes
    - echo "Applying deployment configuration..."
    - kubectl apply -f deployment-service.yaml -n web-apps
    - echo "Waiting for deployment rollout..."
    - kubectl rollout status deployment/boardgame-deployment -n web-apps || true
    - echo "Deployment completed successfully"
    - echo "Verifying deployment:"
    - kubectl get all -n web-apps
  artifacts:
    paths:
      - deployment-service.yaml
    expire_in: 7 days
  only:
    - main
  tags:
    - kubernetes

# Post-Deploy Verification
verify_deployment:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "Verifying deployment readiness..."
    - kubectl get pods -n web-apps
    - kubectl describe deployment boardgame-deployment -n web-apps || true
    - echo "Service status:"
    - kubectl get svc -n web-apps
  when: on_success
  only:
    - main
  tags:
    - kubernetes
