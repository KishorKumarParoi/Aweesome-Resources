apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-web-app
  labels:
    app: python-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-web-app
  template:
    metadata:
      labels:
        app: python-web-app
    spec:
      containers:
      - name: python-app
        image: kishorkumarparoi/python-web-app:v1
        volumeMounts: 
        - name: db-connection
          mountPath: /opt
        env: 
        - name: DB-PORT
          valueFrom: 
            configMapKeyRef: 
              name: test-cm
              key: db-port
        ports:
        - containerPort: 8000
      volumes:
        - name: db-connection
          configMap: 
            name: test-cm 

